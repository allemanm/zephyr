title: Sitronix ST7701 display controller

description: |
    The Sitronix ST7701 is a 16.7M colors TFT-LCD controller
    with a maximum 480RGBx864 resolution.

compatible: "sitronix,st7701"

include: ["sitronix,st7701-common.yaml", spi-device.yaml]

properties:
  pixel-format:
    type: int
    required: true
    description:
      Pixel format. Available formats in dt-bindings/mipi_dsi/mipi_dsi.h.
